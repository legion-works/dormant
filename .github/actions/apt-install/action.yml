name: Install apt packages
description: Install Ubuntu packages and cache their archives and package lists.
inputs:
  packages:
    description: Exact list of package arguments, separated by spaces on one line.
    required: true
runs:
  using: composite
  steps:
    - name: Build apt cache key
      id: key
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: |
        # The key selects a cache. The install script verifies the package
        # lists and archive hashes before it restores any cached files.
        digest=$(printf '%s' "$APT_PACKAGES" | sha256sum)
        # Runners with one image version can have different apt sources
        # (for example a pinned snapshot mirror or the regional mirror list).
        # Archives from one source set do not match the indexes of another,
        # so the source configuration is part of the key.
        # Some of these files are absent on some runners; the step runs with
        # pipefail, so read only the files that exist.
        sources=$(for f in /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt; do
          if [[ -f $f ]]; then cat -- "$f"; fi
        done | sha256sum)
        # The image version comes last so a job on a newer image can restore
        # the previous image's archives through the prefix below.
        prefix="apt-debs-v4-${ImageOS:-unknown}-${RUNNER_ARCH:-unknown}-${digest%% *}-${sources:0:16}-"
        printf 'prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"
        printf 'value=%s%s\n' "$prefix" "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Restore apt cache
      id: restore
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/dormant-apt-debs
        key: ${{ steps.key.outputs.value }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Install apt packages
      id: install
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_DEB_CACHE_DIR: ${{ runner.temp }}/dormant-apt-debs
      run: |
        read -r -a packages <<< "$APT_PACKAGES"
        bash scripts/ci/apt_install.sh "${packages[@]}"
    - name: Save apt cache
      if: success() && steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.cache-ready == 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/dormant-apt-debs
        key: ${{ steps.key.outputs.value }}
