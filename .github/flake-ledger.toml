[[incident]]
id = "FLAKE-2026-07-18-MPV-FIRSTFRAME"
test = "screensaver::tests::mpv_render_context_created_with_advanced_control"
first_seen = "2026-07-19"
signature = "sha256:6c3c65304df27ffa40bf0088783c56e9adc175e97011ff2bbec3b3f7648ace3b"
first_run_url = ""
last_run_url = ""
mechanism = "real-clock first-frame deadline in the libmpv render-context test; fails intermittently under full-workspace CPU contention, passes when run isolated (3 sightings during M1 T5/T6/T7 full-suite runs; re-observed by the ci profile during M3 T17)"
reproduction = "cargo nextest run --profile ci --workspace --all-features"
root_cause = "real-clock frame-production deadlines in the mpv render tests were PERFORMANCE gates, not hang detectors. mpv decodes on its own threads; under nextest parallelism those threads get starved for far longer than the decode itself takes, so any bound tight enough to assert speed fails on LOAD rather than on regression. This test allowed 10s for 5 frames; the sibling MPV-FIRSTFRAME allowed 200ms total (10 polls x 20ms) for mpv to initialise AND decode its first frame. Three further sites in the same file carried the same shape unreported (8s, 5s, and a 20x20ms loop). All five now share FRAME_PUMP_TIMEOUT = 60s, documented as a hang detector. Raising it costs nothing in the passing case: every loop exits as soon as it has the frames it needs, so the bound only binds on a real failure."
fix_pr = ""
proving_test = "mutation control: FRAME_PUMP_TIMEOUT = 1ms makes both ledger tests fail (exit 100, both named); at 60s both pass under full CPU saturation (16 spinners on a 16-core box)"
soak_evidence = []
status = "open"

[[incident]]
id = "FLAKE-2026-07-18-RENDER-FRAMES"
test = "screensaver::tests::renders_non_zero_changing_frames"
first_seen = "2026-07-19"
signature = "sha256:5ad1de95466bf0815d42052c0c74653b176e3015c1c0cde9ef884e824b30ef14"
first_run_url = ""
last_run_url = ""
mechanism = "TWO DISTINCT MECHANISMS share this test name — check the failure DURATION before assuming which. (1) real-clock libmpv frame-production deadline, sibling of FLAKE-2026-07-18-MPV-FIRSTFRAME, addressed by FRAME_PUMP_TIMEOUT = 60s: a failure of this kind takes ~60s. (2) UNDIAGNOSED fast-failing assertion, observed 2026-08-18 on a full-workspace pre-push run at 1.301s (FLKY-FL 2/3) on a tree that already carried the 60s bound at all five sites. 1.3s cannot be a 60s expiry, so mechanism (1) was not what fired. The loop exits at 30 frames in ~1.3s whether it passes or fails, so one of the three post-loop asserts is failing: rendered >= 5, non_zero > 1000 on the first frame, or unique >= 2 across frame hashes. Which one is NOT yet known — the assert message was not captured before the retry passed."
reproduction = "For mechanism (1): cargo nextest run -p dormant-render --lib --stress-count 100 --retries 0 --flaky-result fail -E 'test(renders_non_zero_changing_frames)'. Mechanism (2) does NOT reproduce this way — 2026-08-18 attempts that all PASSED: 12x stress under 12 CPU spinners (12/12), the full dormant-render --lib suite twice (187/187 each), and the test alone (1.294s, vs 1.301s when it failed). It has so far only been seen inside a full-workspace run (2681 tests across dormant-core + dormantd + dormant-render), which suggests contention with something outside dormant-render rather than CPU starvation. Next attempt should run the full workspace suite repeatedly and capture the assert message — that is the missing datum."
root_cause = "PARTIAL — covers mechanism (1) only. Real-clock frame-production deadlines in the mpv render tests were PERFORMANCE gates, not hang detectors. mpv decodes on its own threads; under nextest parallelism those threads get starved for far longer than the decode itself takes, so any bound tight enough to assert speed fails on LOAD rather than on regression. This test allowed 10s for 5 frames; the sibling MPV-FIRSTFRAME allowed 200ms total (10 polls x 20ms) for mpv to initialise AND decode its first frame. Three further sites in the same file carried the same shape unreported (8s, 5s, and a 20x20ms loop). All five now share FRAME_PUMP_TIMEOUT = 60s, documented as a hang detector. Raising it costs nothing in the passing case: every loop exits as soon as it has the frames it needs, so the bound only binds on a real failure. WHAT THIS DOES NOT EXPLAIN: the 2026-08-18 failure at 1.301s. Do not read this entry as 'fixed, any new failure is inexplicable', and do not re-raise FRAME_PUMP_TIMEOUT in response to a fast failure — the timeout is not what fires in mechanism (2)."
fix_pr = ""
proving_test = "For mechanism (1) — mutation control: FRAME_PUMP_TIMEOUT = 1ms makes both ledger tests fail (exit 100, both named); at 60s both pass under full CPU saturation (16 spinners on a 16-core box). Mechanism (2) has NO proving test yet, because it has not been reproduced outside the full-workspace run where it was observed."
soak_evidence = []
status = "open"

[[incident]]
id = "FLAKE-2026-07-23-TRAY-IPC-EVENT-ORDER"
test = "ipc_roundtrip::ipc_status_and_events_roundtrip_via_dormantctl_client"
