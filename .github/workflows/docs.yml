name: Docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # No same-SHA rerun guard here: unlike the CI gates, re-publishing the
      # current master (a rerun or a workflow_dispatch) is a legitimate
      # operation — the guard exists to stop rerun-roulette on required
      # checks, and this workflow is publish-only.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - run: bash scripts/gates/mdbook.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5