name: Release changelog gate
#
# Reusable workflow wired into release.yml's `global-artifacts-jobs` custom
# job hook (see dist-workspace.toml). dist adds the calling job
# (`custom-release-changelog-gate`) to `host`'s `needs` and success predicate
# for us, so a failure here blocks `host` from creating/publishing the
# GitHub release. Do not hand-edit that wiring in release.yml directly —
# rerun `dist generate` after changing this file or the dist-workspace.toml
# config instead (see .github/workflows/release.yml's autogenerated header).
#
# This job runs `release-prep.py --check`, which verifies that every
# changelog fragment declaring a surface (readme, docs chapter, capability
# highlights) actually delivered that surface. A fragment that promises a
# README bullet must have that bullet embedded in README.md; a fragment that
# promises a docs chapter must be accompanied by a docs/src/ change since the
# previous tag; a capability fragment must produce a compiled Highlights
# entry. Any violation fails the gate and blocks the release.

on:
  workflow_call:

jobs:
  release-changelog-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # release-prep.py diffs against the previous tag; a shallow clone
          # breaks the tag comparison.
          fetch-depth: 0
      - name: Gate changelog surface claims
        run: python3 scripts/release-prep.py --check
