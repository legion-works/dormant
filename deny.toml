[graph]
# cargo-deny v2 schema — graph section is required but can be minimal

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # ksni (dormant-tray's StatusNotifierItem library) is Unlicensed —
  # the maintainer placed it under the Unlicense; OSI-approved, FSF
  # Free/Libre.  Allowed because it's source-only consumption from us.
  "Unlicense",
  # slotmap (transitive via fontdb → usvg → resvg → dormant-tray
  # build-dep) ships under the zlib license.  Build-time codegen only;
  # not linked into the tray binary.
  "Zlib",
]
# libmpv2 / libmpv2-sys declare license = "LGPL-2.1" in their upstream
# Cargo.toml — a deprecated SPDX expression that cargo-deny's parser flags
# as a parse-error before the allow list is consulted.  A clarify block
# overrides the manifest expression with the valid SPDX id (the deprecated
# LGPL-2.1 maps to LGPL-2.1-only; the +/or-later postfix was separate),
# and the exception permits it for these crates only.
# NOTE: the license-files hash pins the upstream LICENSE bytes — a future
# libmpv2/libmpv2-sys bump that ships a changed LICENSE fails cargo-deny
# hard (deliberate fail-closed tripwire); recompute with `xxhsum -H0` then.
[[licenses.clarify]]
crate = "libmpv2"
expression = "LGPL-2.1-only"
license-files = [{ path = "LICENSE", hash = 0x13b834cd }]

[[licenses.clarify]]
crate = "libmpv2-sys"
expression = "LGPL-2.1-only"
license-files = [{ path = "LICENSE", hash = 0x13b834cd }]

[[licenses.exceptions]]
crate = "libmpv2"
allow = ["LGPL-2.1-only"]

[[licenses.exceptions]]
crate = "libmpv2-sys"
allow = ["LGPL-2.1-only"]

[[licenses.exceptions]]
# Apache-2.0 superset with binary-attribution waiver, no copyleft; pulled in by pipewire→system-deps→cfg-expr.
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
# "wildcards" are semver-minimum specs like "2" (≥2.0.0) — standard Cargo practice
wildcards = "allow"
# multiple versions of transitive deps are normal in Rust; warn but don't block
multiple-versions = "warn"

[advisories]
# vulnerability, unsound, notice, yanked are always errors in cargo-deny v2
unmaintained = "workspace"
ignore = [
  # rustls-webpki vulns — rumqttc v0.24 pins 0.102.x; fix requires rumqttc upgrade
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  # serde_yaml recursion — ddc-hi pins 0.7.x via mccs-db (parses the bundled
  # MCCS capability database shipped in the crate, not user/network input);
  # dormant's own config format is TOML
  "RUSTSEC-2018-0005",
]
