[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "legion-works/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Post-announce jobs to run in CI
post-announce-jobs = ["./publish-aur"]
# Generate checksums for release artifacts
checksums = true
# Global artifacts jobs to run in CI
global-artifacts-jobs = ["./release-artifact-smoke", "./release-changelog-gate"]
# Features to pass to cargo build
features = ["web-ui"]
# Whether to pass --all-features to cargo build
all-features = false
github-build-setup = "../dist-build-setup.yml"

# Pin the Apple runners explicitly instead of trusting dist's defaults to
# stay put: arm64 (M1/M2/M3) builds on the standard Apple Silicon runner,
# x86_64 builds on the dedicated Intel runner (Apple Silicon runners cross
# x86_64 only via Rosetta, which dist does not use for real builds).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
x86_64-apple-darwin = "macos-15-intel"

# Release builds need system libraries. Apt itself only runs on the Linux
# runners, but `targets` is kept explicit below anyway so the Linux-only
# scope is obvious from this file alone now that Apple targets are present:
# - libudev-dev: tokio-serial → libudev-sys
# - libwayland-dev: dormant-render → wayland-sys (wayland-client.pc)
# - libmpv-dev: dormant-render screensaver → libmpv2
# - libpipewire-0.3-dev: dormantd active sampling → libspa-sys
# - pkg-config: build-script probes for the above
[dist.dependencies.apt]
libudev-dev = { targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
] }
libwayland-dev = { targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
] }
libmpv-dev = { targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
] }
# Quoted: TOML reads a bare `libpipewire-0.3-dev` as the dotted key
# `libpipewire-0` → `3-dev`, so apt is handed the package name
# `libpipewire-0`, which does not exist.
"libpipewire-0.3-dev" = { targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
] }
pkg-config = { targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
] }
