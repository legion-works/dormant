# Tier 2 — recommended default for a desk that blanks reliably.
#
# HLK-LD2410C 24GHz mmWave presence sensor on ESP32-C6 with WiFi + MQTT.
# Publishes occupancy binary_sensors over MQTT and the native ESPHome API;
# dormant should consume the energy-gated `desk_seated` topic for the desk.
# `desk_seated` is preferred over `desk_near`: close-range gate 0/1 presence
# can read absent while still-energy remains a reliable occupied signal.
# Shipped calibration defaults are near_cutoff 1.6 m and still_energy_floor 28.
# They came from measuring still-energy per scenario (away/seated/standing) and
# choosing a floor that splits the worst-present from the best-absent reading.
#
# This is one of two supported topologies for the same radar (see
# docs/src/sensors.md "Two ways to wire the LD2410C"): the ESP carries the
# radar over WiFi so it can live anywhere with power. The other topology wires
# the radar straight into the host with a USB-serial adapter (type =
# "usb-ld2410") and needs no ESP at all.
#
# Wiring (5 pins, JST 1.25mm on sensor side):
#   Sensor VCC → board 5V     (NOT 3V3 — the radar browns out at 3.3V)
#   Sensor GND → board GND
#   Sensor TX  → board RX  (rx_pin below)
#   Sensor RX  → board TX  (tx_pin below)
#   Sensor OUT → unused (digital presence pin; UART carries richer data)
#
# UART pins vary by board — set rx_pin/tx_pin to the GPIOs you actually wired
# and confirm they are free (not USB/strapping pins). This example uses the
# ESP32-C6 SuperMini (GPIO19/GPIO20; native USB is GPIO12/13, BOOT is GPIO9).
# The DevKitC-1 / DevKitM-1 commonly break out GPIO4/GPIO5 instead.

substitutions:
  device_name: ld2410c-desk
  friendly_name: "Desk Presence"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2025.12.0"
  # Ask the radar for its stored gate config once the UART is up. Without this
  # the ld2410 `number:` entities never receive a value -- see the comment above
  # the `button:` block. The delay puts the read after wifi/API association so a
  # consumer is connected to observe the result.
  on_boot:
    - priority: -100
      then:
        - delay: 15s
        - button.press: radar_query_params

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # mmWave presence wants low latency; default modem power-save adds seconds.
  power_save_mode: none

  ap:
    ssid: ${device_name}-fallback
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  # If Home Assistant already gets this device over the native API above,
  # leave discovery off so HA doesn't add a duplicate MQTT copy. Set it true
  # for an MQTT-only setup (and drop the api: block).
  discovery: false
  # retain: true on both so a late subscriber (dormant restarting) reads true
  # availability instead of a stale value — the sensor's fail-safe hinges on it.
  birth_message:
    topic: ${device_name}/status
    payload: online
    retain: true
  will_message:
    topic: ${device_name}/status
    payload: offline
    retain: true

uart:
  tx_pin: GPIO20
  rx_pin: GPIO19
  baud_rate: 256000

ld2410:

binary_sensor:
  - platform: ld2410
    has_target:
      id: has_tgt
      name: "${friendly_name} Occupancy"
      device_class: occupancy
    has_moving_target:
      name: "${friendly_name} Moving"
      device_class: motion
    has_still_target:
      name: "${friendly_name} Still"
      device_class: occupancy

  # 1D distance zones: a radial partition at a runtime-tunable cutoff. The
  # LD2410C reports one target along a single axis (distance), so it cannot do
  # 2D X/Y zones like an LD2450 — but near/far is most of the value for a desk.
  # raw_state bypasses the MQTT throttle filter so zone edges react instantly.
  - platform: template
    name: "${friendly_name} Desk Near"
    device_class: occupancy
    lambda: |-
      if (!id(has_tgt).state) return false;
      if (std::isnan(id(det_dist).raw_state)) return false;
      return id(det_dist).raw_state <= id(near_cutoff).state * 100.0f;
    filters:
      - delayed_off: 5s
  - platform: template
    name: "${friendly_name} Room Far"
    device_class: occupancy
    lambda: |-
      if (!id(has_tgt).state) return false;
      if (std::isnan(id(det_dist).raw_state)) return false;
      return id(det_dist).raw_state > id(near_cutoff).state * 100.0f;
    filters:
      - delayed_off: 5s
  # Energy-gated desk presence: the LD2410C's presence flags can read
  # absent at close range (gate 0/1 have no static sensitivity) and can
  # glitch on distance. This template bypasses both — if still-energy
  # exceeds the tunable floor, the desk is occupied regardless of flags.
  # Use this as the occupancy source for a desk zone in dormant; leave
  # desk_near + room_far for general near/far partitioning when the
  # reported presence flags are reliable.
  - platform: template
    name: "${friendly_name} Desk Seated"
    id: desk_seated
    device_class: occupancy
    lambda: |-
      if (std::isnan(id(still_energy).raw_state)) return {};
      // Energy above floor: present regardless of has_target / distance.
      // Also gate on distance when within near_cutoff (belt-and-suspenders).
      bool energy_ok = id(still_energy).raw_state >= id(still_energy_floor).state;
      if (energy_ok) return true;
      if (!id(has_tgt).state) return false;
      if (std::isnan(id(det_dist).raw_state)) return false;
      return id(det_dist).raw_state <= id(near_cutoff).state * 100.0f;
    filters:
      - delayed_off: 5s

# Temporary calibration aid (disabled): add per-gate `g0`–`g8` `move_energy`
# and `still_energy` sensors under the ld2410 sensor platform while tuning.
# Leaving those 18 entities enabled cost 81% of a Home Assistant recorder's
# rows with nothing subscribing. Re-add only for a bounded calibration run.
# Diagnostic/tuning sensors — throttled so MQTT traffic stays sane.
sensor:
  - platform: ld2410
    detection_distance:
      id: det_dist
      name: "${friendly_name} Detection Distance"
      filters: [throttle: 10s]
    moving_energy:
      id: moving_energy
      name: "${friendly_name} Moving Energy"
      filters: [throttle: 10s]
    still_energy:
      id: still_energy
      name: "${friendly_name} Still Energy"
      filters: [throttle: 10s]
    moving_distance:
      name: "${friendly_name} Moving Distance"
      filters: [throttle: 10s]
    still_distance:
      name: "${friendly_name} Still Distance"
      filters: [throttle: 10s]

# The ld2410 `number:` entities below are a VIEW onto the radar module's own
# NVM, not values ESPHome owns -- nothing here sets them, so they read `unknown`
# until something asks the module for its stored config. That read is a separate
# entity, and without this button the gate thresholds never populate: the
# "adjustable from Home Assistant" claim below is false for all of them.
# Verified 2026-08-14 on a live device -- every g0-g8 threshold read `unknown`
# in Home Assistant while the radar was operating on a real calibration curve.
#
# The esphome: on_boot press above populates them without a human remembering.
button:
  - platform: ld2410
    query_params:
      id: radar_query_params
      name: "${friendly_name} Query Radar Params"
    restart:
      name: "${friendly_name} Restart Radar"

# Runtime tuning: detection-bubble shaping + zone cutoff, all adjustable from
# Home Assistant without reflashing.
number:
  - platform: ld2410
    timeout:
      name: "${friendly_name} Radar Timeout"
    max_move_distance_gate:
      name: "${friendly_name} Max Move Gate"
    max_still_distance_gate:
      # Lowering this gate to just past the chair (e.g. 2 = 225 cm for a
      # desk) masks people on furniture behind the desk at the source — the
      # chip stops reporting still targets beyond the gate, which also
      # stabilizes detection_distance against far-wall echo jumps.
      name: "${friendly_name} Max Still Gate"
    # Per-gate sensitivity thresholds (0-100). Lower = more sensitive.
    # Gate 0/1 still thresholds exist in YAML but are not settable in
    # hardware per the HLK-LD2410C datasheet — setting them has no effect.
    g0:
      move_threshold:
        name: "${friendly_name} G0 Move Threshold"
      still_threshold:
        name: "${friendly_name} G0 Still Threshold"
    g1:
      move_threshold:
        name: "${friendly_name} G1 Move Threshold"
      still_threshold:
        name: "${friendly_name} G1 Still Threshold"
    g2:
      move_threshold:
        name: "${friendly_name} G2 Move Threshold"
      still_threshold:
        name: "${friendly_name} G2 Still Threshold"
    g3:
      move_threshold:
        name: "${friendly_name} G3 Move Threshold"
      still_threshold:
        name: "${friendly_name} G3 Still Threshold"
    g4:
      move_threshold:
        name: "${friendly_name} G4 Move Threshold"
      still_threshold:
        name: "${friendly_name} G4 Still Threshold"
    g5:
      move_threshold:
        name: "${friendly_name} G5 Move Threshold"
      still_threshold:
        name: "${friendly_name} G5 Still Threshold"
    g6:
      move_threshold:
        name: "${friendly_name} G6 Move Threshold"
      still_threshold:
        name: "${friendly_name} G6 Still Threshold"
    g7:
      move_threshold:
        name: "${friendly_name} G7 Move Threshold"
      still_threshold:
        name: "${friendly_name} G7 Still Threshold"
    g8:
      move_threshold:
        name: "${friendly_name} G8 Move Threshold"
      still_threshold:
        name: "${friendly_name} G8 Still Threshold"
  - platform: template
    name: "${friendly_name} Near Cutoff"
    id: near_cutoff
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    unit_of_measurement: m
    min_value: 0.5
    max_value: 6.0
    step: 0.25
    initial_value: 1.6
    optimistic: true
    restore_value: true
  # Still-energy floor: when still_energy exceeds this value the desk is
  # considered occupied regardless of the LD2410's reported presence flags
  # or detection_distance. Calibrate by recording still-energy per scenario
  # (away / seated / standing / couch) and picking a floor that splits the
  # worst-present measurement from the best-absent measurement with margin.
  # Typical baselines: empty-room 3-5, occupied 40+.
  - platform: template
    name: "${friendly_name} Still Energy Floor"
    id: still_energy_floor
    icon: mdi:gauge
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 28
    optimistic: true
    restore_value: true

# ——— Staleness and heartbeat ——————————————————————————————————————————
# Binary sensors publish on-change only: no edge → no MQTT message. During
# long still periods (occupant seated, no movement) a change-only topic
# goes silent, dormant's sensors.<id>.stale_timeout fires, and the sensor
# reads unavailable. The fail-safe (default zone policy = "present") keeps
# the display on, but occupancy-driven wake is lost until the next edge.
#
# The heartbeat below re-publishes the current desk_seated state every
# 5 minutes even when unchanged, so silence again means "device gone", not
# "occupant still". Verified on the maintainer's device: retained value on
# subscribe, then republishes at exact 5-minute marks.
#
# Match dormant's stale_timeout to a bit over one heartbeat (e.g. "6m"):
# the daemon then only goes unavailable if the ESP truly drops off the
# network. The topic must match this config's MQTT naming:
#   <device_name>/binary_sensor/<friendly_name snake_cased>_desk_seated/state

interval:
  - interval: 5min
    then:
      - mqtt.publish:
          topic: ${device_name}/binary_sensor/desk_presence_desk_seated/state
          payload: !lambda |-
            return id(desk_seated).state ? std::string("ON") : std::string("OFF");
          retain: true
      # Occupancy is heartbeaten too: a zone may use desk_seated while a
      # second rule watches plain occupancy, and a topic without a heartbeat
      # goes stale on its own schedule regardless of what the others do.
      - mqtt.publish:
          topic: ${device_name}/binary_sensor/desk_presence_occupancy/state
          payload: !lambda |-
            return id(has_tgt).state ? std::string("ON") : std::string("OFF");
          retain: true
